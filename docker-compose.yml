services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mmsc
      POSTGRES_USER: mmsc
      POSTGRES_PASSWORD: mmsc_dev_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmsc -d mmsc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mmsc:mmsc_dev_password@postgres:5432/mmsc
      API_PORT: 14000
      CORS_ORIGIN: http://localhost:15173,http://localhost:15174
      MEDIA_STORAGE_PATH: /data/uploads
    ports:
      - "14000:14000"
    volumes:
      - media_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:14000/api/v1
    ports:
      - "15173:80"
    depends_on:
      - api

  web-2:
    build:
      context: .
      dockerfile: apps/web-2/Dockerfile
      args:
        VITE_API_URL: http://localhost:14000/api/v1
        VITE_MAIN_APP_URL: http://localhost:15173
    ports:
      - "15174:80"
    depends_on:
      - api

volumes:
  postgres_data:
  media_uploads:
